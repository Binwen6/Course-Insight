<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号处理图解</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
        h1 { color: #333; }
        canvas { border: 1px solid #ddd; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>1. 傅立叶变换图解</h1>
    <canvas id="fourierCanvas" width="600" height="400"></canvas>

    <h1>2. 卷积定理图解</h1>
    <canvas id="convolutionCanvas" width="600" height="400"></canvas>

    <h1>3. 奈奎斯特率图解</h1>
    <canvas id="nyquistCanvas" width="600" height="400"></canvas>

    <script>
        // 傅立叶变换图解
        const fourierCanvas = document.getElementById('fourierCanvas');
        const fCtx = fourierCanvas.getContext('2d');

        function drawFourierTransform() {
            fCtx.clearRect(0, 0, 600, 400);

            // 绘制时域信号
            fCtx.beginPath();
            fCtx.moveTo(0, 200);
            for (let x = 0; x < 300; x++) {
                let y = 200 + Math.sin(x * 0.1) * 50 + Math.sin(x * 0.2) * 30;
                fCtx.lineTo(x, y);
            }
            fCtx.strokeStyle = 'blue';
            fCtx.stroke();

            // 绘制频域信号
            fCtx.beginPath();
            fCtx.moveTo(300, 350);
            fCtx.lineTo(350, 350);
            fCtx.lineTo(350, 250);
            fCtx.moveTo(400, 350);
            fCtx.lineTo(450, 350);
            fCtx.lineTo(450, 300);
            fCtx.strokeStyle = 'red';
            fCtx.stroke();

            // 添加标签
            fCtx.fillStyle = 'black';
            fCtx.font = '14px Arial';
            fCtx.fillText('时域', 10, 20);
            fCtx.fillText('频域', 310, 20);
            fCtx.fillText('傅立叶变换', 250, 200);
            fCtx.fillText('→', 280, 200);
        }

        // 卷积定理图解
        const convolutionCanvas = document.getElementById('convolutionCanvas');
        const cCtx = convolutionCanvas.getContext('2d');

        function drawConvolutionTheorem() {
            cCtx.clearRect(0, 0, 600, 400);

            // 时域
            cCtx.fillStyle = 'black';
            cCtx.font = '14px Arial';
            cCtx.fillText('时域', 50, 50);
            cCtx.fillText('f(t)', 20, 100);
            cCtx.fillText('*', 90, 100);
            cCtx.fillText('g(t)', 110, 100);
            cCtx.fillText('=', 180, 100);
            cCtx.fillText('h(t)', 200, 100);

            // 频域
            cCtx.fillText('频域', 50, 250);
            cCtx.fillText('F(ω)', 20, 300);
            cCtx.fillText('×', 90, 300);
            cCtx.fillText('G(ω)', 110, 300);
            cCtx.fillText('=', 180, 300);
            cCtx.fillText('H(ω)', 200, 300);

            // 箭头
            cCtx.beginPath();
            cCtx.moveTo(50, 150);
            cCtx.lineTo(50, 200);
            cCtx.moveTo(40, 190);
            cCtx.lineTo(50, 200);
            cCtx.lineTo(60, 190);
            cCtx.strokeStyle = 'blue';
            cCtx.stroke();

            cCtx.fillText('傅立叶变换', 60, 180);
        }

        // 奈奎斯特率图解
        const nyquistCanvas = document.getElementById('nyquistCanvas');
        const nCtx = nyquistCanvas.getContext('2d');

        function drawNyquistRate() {
            nCtx.clearRect(0, 0, 600, 400);

            // 绘制原始信号
            nCtx.beginPath();
            nCtx.moveTo(0, 200);
            for (let x = 0; x < 600; x++) {
                let y = 200 + Math.sin(x * 0.1) * 50;
                nCtx.lineTo(x, y);
            }
            nCtx.strokeStyle = 'blue';
            nCtx.stroke();

            // 绘制采样点
            for (let x = 0; x < 600; x += 30) {
                let y = 200 + Math.sin(x * 0.1) * 50;
                nCtx.beginPath();
                nCtx.arc(x, y, 3, 0, Math.PI * 2);
                nCtx.fillStyle = 'red';
                nCtx.fill();
            }

            // 添加标签
            nCtx.fillStyle = 'black';
            nCtx.font = '14px Arial';
            nCtx.fillText('原始信号', 10, 20);
            nCtx.fillText('采样点 (fs ≥ 2fmax)', 10, 40);
        }

        drawFourierTransform();
        drawConvolutionTheorem();
        drawNyquistRate();
    </script>
</body>
</html>
